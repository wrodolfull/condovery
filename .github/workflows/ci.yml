name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://condovery:condovery-ci@127.0.0.1:5432/condovery_test
      BOOTSTRAP_ADMIN_EMAIL: admin-smoke@example.com
      BOOTSTRAP_ADMIN_PASSWORD: CIOnlyLongSecurePass123!
      BOOTSTRAP_CONDO_NAME: Condominio Teste
      BOOTSTRAP_CONDO_SLUG: teste
      BOOTSTRAP_INVITE_CODE: CIOnlyPrivateInvite123!
      NEXT_TELEMETRY_DISABLED: '1'
      SUPABASE_URL: http://127.0.0.1:3333
      SUPABASE_ANON_KEY: ci-publishable-test-only
      SUPABASE_SERVICE_ROLE_KEY: ci-service-test-only
      APP_URL: http://127.0.0.1:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: condovery
          POSTGRES_PASSWORD: condovery-ci
          POSTGRES_DB: condovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U condovery -d condovery_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Start isolated Supabase Auth stub
        run: |
          node scripts/mock-supabase-auth.mjs > /tmp/condovery-auth.log 2>&1 &
          for attempt in $(seq 1 15); do
            if curl -sf http://127.0.0.1:3333/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/condovery-auth.log
          exit 1
      - name: Apply DB schema
        run: node scripts/migrate.mjs
      - name: Verify migrations are idempotent
        run: node scripts/migrate.mjs
      - name: Bootstrap test condominium
        run: node scripts/bootstrap.mjs
      - name: Start app
        run: |
          npm start > /tmp/condovery.log 2>&1 &
          for attempt in $(seq 1 35); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/condovery.log
          exit 1
      - name: API integration test
        run: node scripts/smoke.mjs
      - name: Install Chromium for responsive QA
        run: npx playwright install --with-deps chromium
      - name: Check mobile and desktop overflow
        run: node scripts/visual-smoke.mjs
      - name: Save visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: condovery-responsive-screenshots
          path: artifacts/visual/
          if-no-files-found: ignore
          retention-days: 5
